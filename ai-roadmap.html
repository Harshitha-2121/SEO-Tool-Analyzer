<!DOCTYPE html>
<html lang="en">
<head>
  <script>
    if (localStorage.getItem('logged_in') !== 'true') {
      window.location.href = 'login.html';
    }
  </script>
  
  
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ollagraph AI Recommendations & Roadmap | crawlX</title>
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;700&family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --bg-base: #09090b; --bg: #1A1A1A;
      --bg-card: rgba(20, 20, 25, 0.65);
      --border: rgba(255, 255, 255, 0.08);
      --border-hover: rgba(255, 255, 255, 0.16);
      
      --accent: #10b981;
      --accent-light: #34d399;
      --cyan: #00e5ff;
      --green: #00e676;
      --green-bg: rgba(0, 230, 118, 0.08);
      --green-border: rgba(0, 230, 118, 0.2);
      --yellow: #ffd600;
      --orange: #ff9100;
      --orange-bg: rgba(255, 145, 0, 0.08);
      --orange-border: rgba(255, 145, 0, 0.2);
      --red: #ff1744;
      --red-bg: rgba(255, 23, 68, 0.08);
      --red-border: rgba(255, 23, 68, 0.2);
      
      --text-1: #f4f4f5;
      --text-2: rgba(244, 244, 245, 0.7);
      --text-3: rgba(244, 244, 245, 0.4);
      --radius-sm: 8px;
      --radius-md: 12px;
      --radius-lg: 20px;
      --font-main: 'Inter', sans-serif;
      --ease: cubic-bezier(0.4, 0, 0.2, 1);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg-base);
      color: var(--text-2);
      font-family: var(--font-main);
      overflow-x: hidden;
      min-height: 100vh;
      display: flex;
    }

    /* Scrollbar styling */
    ::-webkit-scrollbar {
      width: 8px;
      height: 8px;
    }
    ::-webkit-scrollbar-track {
      background-color: var(--bg-base);
    }
    ::-webkit-scrollbar-thumb {
      background: var(--bg-card-hover);
      border-radius: 4px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: var(--bg-card-hover);
    }

    
    

    

    

    

    .brand-logo svg {
      width: 28px;
      height: 28px;
      display: block;
    }

    

    

    /* ═══════════════════════════════════════
       LAYOUT: MAIN CONTAINER
       ═══════════════════════════════════════ */
    .main {
      
      flex: 1;
      padding: 40px;
      min-width: 0;
      transition: margin-left 0.3s var(--ease);
    }

    

    /* ═══════════════════════════════════════
       HEADER SECTION
       ═══════════════════════════════════════ */
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 32px;
      flex-wrap: wrap;
      gap: 20px;
    }

    .header__info {
      flex: 1;
      min-width: 280px;
    }

    .header__title {
      font-size: 26px;
      font-weight: 800;
      letter-spacing: -0.8px;
      color: var(--text-1);
      margin-bottom: 6px;
    }

    .header__subtitle {
      font-size: 13.5px;
      color: var(--text-2);
    }

    .header__subtitle strong {
      color: var(--accent);
      font-family: 'Fira Code', monospace;
      font-size: 12.5px;
    }

    /* URL input form */
    .selector-form {
      display: flex;
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      padding: 4px;
      width: 380px;
      transition: all 0.2s;
    }
    .selector-form:focus-within {
      border-color: var(--accent);
      box-shadow: 0 0 0 2px rgba(124, 77, 255, 0.25);
    }
    .selector-input {
      flex: 1;
      background: transparent;
      border: none;
      outline: none;
      color: var(--text-1);
      padding: 6px 12px;
      font-size: 12.5px;
    }
    .selector-btn {
      background: var(--accent);
      border: none;
      border-radius: var(--radius-sm);
      color: var(--text-1); cursor: pointer;
      font-size: 11.5px;
      font-weight: 600;
      padding: 6px 14px;
      transition: background 0.2s;
    }
    .selector-btn:hover {
      background: var(--accent-light);
    }

    /* ═══════════════════════════════════════
       GLASS CARDS & GRIDS
       ═══════════════════════════════════════ */
    .glass-card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      backdrop-filter: blur(10px);
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
      padding: 24px;
      margin-bottom: 24px;
    }

    .glass-card__title {
      font-size: 15px;
      font-weight: 750;
      color: var(--text-1);
      margin-bottom: 18px;
      display: flex;
      align-items: center;
      gap: 8px;
      border-bottom: 1px solid rgba(255,255,255,0.03);
      padding-bottom: 12px;
    }

    .glass-card__title svg {
      color: var(--accent);
    }

    /* AI engine node status header banner */
    .ai-banner {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 16px 24px;
      background: linear-gradient(135deg, rgba(124,77,255,0.1), rgba(0,229,255,0.05));
      border: 1px solid rgba(124, 77, 255, 0.25);
      border-radius: var(--radius-md);
      margin-bottom: 24px;
      gap: 16px;
      flex-wrap: wrap;
    }
    .ai-banner__status {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 12.5px;
    }
    .ai-pulse-dot {
      width: 10px; height: 10px;
      background: var(--green);
      border-radius: 50%;
      position: relative;
      box-shadow: 0 0 10px var(--green);
      animation: pulse 2s infinite;
    }
    @keyframes pulse {
      0% { transform: scale(0.9); opacity: 0.6; }
      50% { transform: scale(1.2); opacity: 1; box-shadow: 0 0 16px var(--green); }
      100% { transform: scale(0.9); opacity: 0.6; }
    }
    .ai-banner__meta {
      font-family: 'Fira Code', monospace;
      font-size: 11.5px;
      color: var(--text-3);
    }

    /* Executive summary card */
    .executive-card {
      border: 1px solid rgba(124, 77, 255, 0.25);
      box-shadow: 0 0 25px rgba(124, 77, 255, 0.08);
      position: relative;
      overflow: hidden;
    }
    .executive-card::before {
      content: '';
      position: absolute;
      left: 0; top: 0; bottom: 0;
      width: 4px;
      background: linear-gradient(to bottom, var(--accent), var(--cyan));
    }
    .executive-summary-text {
      font-size: 13.5px;
      line-height: 1.6;
      color: var(--text-1);
    }

    /* Grid columns */
    .split-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 24px;
      margin-bottom: 24px;
    }

    @media (max-width: 992px) {
      .split-grid {
        grid-template-columns: 1fr;
      }
    }

    /* ═══════════════════════════════════════
       PRIORITIZED AI CARD DECK
       ═══════════════════════════════════════ */
    .ai-cards-deck {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 16px;
      margin-top: 10px;
    }
    @media (max-width: 600px) {
      .ai-cards-deck {
        grid-template-columns: 1fr;
      }
    }

    .ai-card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      transition: all 0.3s var(--ease);
      position: relative;
    }
    .ai-card:hover {
      border-color: var(--border-hover);
      background: var(--bg-card);
      transform: translateY(-2px);
    }

    .ai-card-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .priority-badge {
      font-size: 9.5px;
      font-weight: 800;
      text-transform: uppercase;
      padding: 3px 8px;
      border-radius: 4px;
      letter-spacing: 0.5px;
    }
    .priority-badge--critical { background: var(--red-bg); color: var(--red); border: 1px solid var(--red-border); }
    .priority-badge--high { background: var(--orange-bg); color: var(--orange); border: 1px solid var(--orange-border); }
    .priority-badge--medium { background: rgba(255, 214, 0, 0.08); color: var(--yellow); border: 1px solid rgba(255, 214, 0, 0.2); }
    .priority-badge--low { background: var(--green-bg); color: var(--green); border: 1px solid var(--green-border); }

    .gain-tag {
      font-family: 'Fira Code', monospace;
      font-size: 11px;
      font-weight: 700;
      color: var(--cyan);
    }

    .ai-card-title {
      font-size: 14px;
      font-weight: 750;
      color: var(--text-1);
    }

    .ai-card-desc {
      font-size: 12.5px;
      color: var(--text-2);
      line-height: 1.4;
    }

    .ai-card-action {
      font-size: 11px;
      color: var(--accent);
      background: rgba(124, 77, 255, 0.05);
      border: 1px solid rgba(124, 77, 255, 0.1);
      padding: 6px 12px;
      border-radius: var(--radius-sm);
      font-weight: 600;
      margin-top: auto;
      text-align: center;
    }

    /* ═══════════════════════════════════════
       COMPETITOR INSIGHTS
       ═══════════════════════════════════════ */
    .competitor-row {
      display: flex;
      flex-direction: column;
      gap: 16px;
      margin-top: 10px;
    }
    .competitor-item {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .competitor-meta {
      display: flex;
      justify-content: space-between;
      font-size: 12.5px;
    }
    .competitor-name {
      font-weight: 700;
      color: var(--text-1);
    }
    .competitor-name span {
      font-weight: 500;
      font-size: 11px;
      color: var(--text-3);
      margin-left: 6px;
    }
    .competitor-share {
      font-family: 'Fira Code', monospace;
      font-weight: 700;
      color: var(--text-2);
    }
    .competitor-bar-track {
      height: 10px;
      background: var(--bg-card);
      border-radius: 5px;
      border: 1px solid var(--border);
      overflow: hidden;
    }
    .competitor-bar {
      height: 100%;
      background: linear-gradient(90deg, var(--accent), var(--cyan));
      border-radius: 4px;
      transition: width 1.2s var(--ease);
      width: 0%;
    }

    /* ═══════════════════════════════════════
       SEO ROADMAP TIMELINE
       ═══════════════════════════════════════ */
    .roadmap-timeline {
      display: flex;
      flex-direction: column;
      position: relative;
      padding-left: 28px;
      margin-top: 10px;
    }
    .roadmap-timeline::before {
      content: '';
      position: absolute;
      left: 7px; top: 0; bottom: 0;
      width: 2px;
      background: var(--border);
    }
    .roadmap-node {
      position: relative;
      padding-bottom: 24px;
    }
    .roadmap-node:last-child {
      padding-bottom: 0;
    }
    .roadmap-bullet {
      position: absolute;
      left: -28px; top: 4px;
      width: 16px; height: 16px;
      border-radius: 50%;
      background-color: var(--bg-base);
      border: 3.5px solid var(--accent);
      z-index: 2;
    }
    .roadmap-node:nth-child(2) .roadmap-bullet { border-color: var(--cyan); }
    .roadmap-node:nth-child(3) .roadmap-bullet { border-color: var(--yellow); }

    .roadmap-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 6px;
    }
    .roadmap-phase {
      font-size: 13.5px;
      font-weight: 800;
      color: var(--text-1);
    }
    .roadmap-time {
      font-size: 11px;
      font-weight: 700;
      color: var(--text-3);
      text-transform: uppercase;
    }
    .roadmap-desc {
      font-size: 12.5px;
      color: var(--text-2);
      line-height: 1.4;
    }
  
    /* Animated Glowing Search Bar */
    .animated-glowing-search-wrapper {
      position: relative;
      border-radius: var(--radius-md);
      padding: 1.5px;
      background: var(--bg-card);
      overflow: hidden;
      z-index: 1;
      display: flex;
      align-items: center;
      transition: all 0.3s ease;
      width: 100%;
    }

    .animated-glowing-search-wrapper::before {
      content: '';
      position: absolute;
      top: -100%; left: -100%;
      width: 300%; height: 300%;
      background: conic-gradient(from 0deg, transparent 0%, transparent 40%, var(--accent) 50%, var(--accent) 60%, transparent 100%);
      animation: searchGlowSpin 4s linear infinite;
      z-index: -2;
      opacity: 0.15;
      transition: opacity 0.3s ease;
    }

    .animated-glowing-search-wrapper:focus-within::before {
      opacity: 1;
      animation: searchGlowSpin 2s linear infinite;
    }

    .animated-glowing-search-wrapper::after {
      content: '';
      position: absolute;
      inset: 1.5px;
      background: var(--bg-card);
      border-radius: calc(var(--radius-md) - 1.5px);
      z-index: -1;
    }

    @keyframes searchGlowSpin {
      100% { transform: rotate(360deg); }
    }

    .animated-glowing-search-input {
      width: 100%;
      padding: 14px 20px;
      background: transparent;
      border: none;
      color: var(--text-1);
      font-size: 14px;
      outline: none;
      z-index: 2;
    }
    .animated-glowing-search-input::placeholder {
      color: var(--text-3);
    }

  </style>

  
\n</head>
<body>

  
    

  <!-- Main Container -->
  <main class="main">

    <header class="header">
      <div class="header__info">
        <h1 class="header__title">Ollagraph AI Recommendations</h1>
        <div class="header__subtitle">Llama-3 powered SEO action roadmap plan for: <strong id="headerUrlText">example.com</strong></div>
      </div>
      <div class="header__actions">
        <form class="selector-form" id="aiSelectorForm">
          <div class="animated-glowing-search-wrapper"><input  type="text"  class="animated-glowing-search-input"  id="targetUrlInput" placeholder="Enter site (e.g. site.com)" required></div>
          <button type="submit" class="selector-btn">Analyze</button>
        </form>
      </div>
    </header>

    <!-- AI status banner -->
    <div class="ai-banner">
      <div class="ai-banner__status">
        <span class="ai-pulse-dot"></span>
        <span>Local Ollama Node: <strong style="color:var(--text-1);">Active</strong></span>
      </div>
      <div class="ai-banner__meta">Model: llama3-seo-ollagraph-8b</div>
    </div>

    <!-- Executive Summary -->
    <div class="glass-card executive-card">
      <h2 class="glass-card__title">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="21" y1="6" x2="3" y2="6"/><line x1="21" y1="12" x2="9" y2="12"/><line x1="21" y1="18" x2="7" y2="18"/></svg>
        Executive Summary
      </h2>
      <p class="executive-summary-text" id="executiveSummaryText">
        Analyzing domain context...
      </p>
    </div>

    <!-- Prioritized AI Cards deck -->
    <div class="glass-card">
      <h2 class="glass-card__title">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
        Prioritized AI Action Recommendations
      </h2>
      
      <div class="ai-cards-deck" id="aiCardsDeck">
        <!-- Populated dynamically -->
      </div>
    </div>

    <!-- Split Competitor Insights & Roadmap -->
    <div class="split-grid">
      
      <!-- Competitor Insights -->
      <div class="glass-card">
        <h2 class="glass-card__title">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
          Competitor Organic Market Share
        </h2>
        
        <div class="competitor-row" id="competitorList">
          <!-- Populated dynamically -->
        </div>
      </div>

      <!-- Roadmap Timeline -->
      <div class="glass-card">
        <h2 class="glass-card__title">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2v20M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/></svg>
          SEO Implementation Roadmap
        </h2>
        
        <div class="roadmap-timeline" id="roadmapTimeline">
          <!-- Populated dynamically -->
        </div>
      </div>

    </div>

  </main>

  <script>
    
// Logout Handler
    const logoutBtn = document.getElementById('logoutBtn');
    if (logoutBtn) {
      logoutBtn.addEventListener('click', (e) => {
        e.preventDefault();
        localStorage.removeItem('logged_in');
        localStorage.removeItem('user_email');
        window.location.href = 'login.html';
      });
    }
  </script>
  <script src="strategy-engine.js" defer></script>

  

  

  <script src="ask-ai.js" defer></script>

  
\n
  <script src="sidebar.js?v=2"></script>
</body>
</html>
